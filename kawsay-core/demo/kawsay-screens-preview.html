<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAWSAY screens 4 and 6 - development preview</title>
<style>
body { margin: 0; background: #f3f5f7; }
.demo-banner { background: #3b2f00; color: #fff; padding: 0.5rem 1rem; font: 600 0.85rem system-ui, sans-serif; text-align: center; }
.demo-tabs { display: flex; gap: 0.5rem; justify-content: center; padding: 0.75rem; }
.demo-tabs button { font: inherit; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #8a99a8; background: #fff; cursor: pointer; }
.demo-tabs button[aria-pressed="true"] { background: #16202a; color: #fff; }
/* Minimal neutral styles for screens 4 and 6. Restyle freely to match the app's design. */
.kw-screen { max-width: 46rem; margin: 0 auto; padding: 1rem; font-family: system-ui, sans-serif; line-height: 1.45; color: #16202a; }
.kw-screen h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
.kw-screen h2 { font-size: 1rem; margin: 0.75rem 0 0.25rem; text-transform: uppercase; letter-spacing: 0.04em; }
.kw-screen h3 { font-size: 0.95rem; margin: 1rem 0 0.25rem; }
.kw-note, .kw-hint { font-size: 0.85rem; color: #4a5a6a; margin: 0.25rem 0 0.75rem; }
.kw-group { border: 1px solid #c9d3dc; border-radius: 8px; margin: 0 0 0.75rem; padding: 0.5rem 0.75rem; }
.kw-group legend { font-weight: 600; padding: 0 0.25rem; }
.kw-field { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.4rem 0; border-top: 1px solid #e6ebf0; }
.kw-field:first-of-type { border-top: 0; }
.kw-label { flex: 1 1 12rem; }
.kw-choices { display: flex; gap: 0.75rem; flex-wrap: wrap; }
.kw-choices label { display: inline-flex; gap: 0.25rem; align-items: center; min-height: 2rem; }
.kw-field input[type="number"], .kw-screen select { font: inherit; padding: 0.35rem 0.5rem; min-width: 8rem; border: 1px solid #8a99a8; border-radius: 6px; }
.kw-actions { display: flex; gap: 0.5rem; }
.kw-actions button { font: inherit; padding: 0.6rem 1.1rem; border-radius: 8px; border: 1px solid #8a99a8; background: #fff; cursor: pointer; }
.kw-actions .kw-primary { background: #16202a; color: #fff; border-color: #16202a; font-weight: 600; }
.kw-errors { color: #8f1d1d; font-size: 0.9rem; padding-left: 1.1rem; }
.kw-result { margin-top: 1rem; border: 2px solid #5b6b7a; border-left-width: 10px; border-radius: 8px; padding: 0.75rem 1rem; background: #fff; }
.kw-badge { display: inline-block; margin: 0; padding: 0.2rem 0.6rem; border-radius: 6px; font-weight: 700; letter-spacing: 0.05em; color: #fff; background: #5b6b7a; }
.kw-action { font-size: 1.2rem; font-weight: 600; margin: 0; }
.kw-level-emergency { border-color: #a61b1b; } .kw-level-emergency .kw-badge { background: #a61b1b; }
.kw-level-priority { border-color: #b45309; } .kw-level-priority .kw-badge { background: #b45309; }
.kw-level-scheduled { border-color: #1d4f91; } .kw-level-scheduled .kw-badge { background: #1d4f91; }
.kw-level-follow-up { border-color: #1f6b3a; } .kw-level-follow-up .kw-badge { background: #1f6b3a; }
.kw-clock progress { width: 100%; height: 0.6rem; }
.kw-countdown { font-size: 1.05rem; margin: 0.4rem 0; }
.kw-milestones { margin: 0.4rem 0; padding-left: 1.2rem; font-size: 0.9rem; }
.kw-reached { color: #4a5a6a; }
.kw-why { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.75rem; font-size: 0.9rem; margin: 0; }
.kw-why dt { font-weight: 600; } .kw-why dd { margin: 0; }
.kw-filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem; }
.kw-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.6rem; margin-bottom: 0.5rem; }
.kw-tile { border: 1px solid #c9d3dc; border-radius: 8px; padding: 0.6rem 0.75rem; }
.kw-tile-title { margin: 0; font-size: 0.85rem; font-weight: 600; }
.kw-tile-value { margin: 0.1rem 0; font-size: 1.7rem; font-weight: 700; }
.kw-tile-detail { margin: 0; font-size: 0.78rem; color: #4a5a6a; }
.kw-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.75rem; }
.kw-table caption { text-align: left; color: #4a5a6a; padding-bottom: 0.3rem; }
.kw-table th, .kw-table td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #e6ebf0; vertical-align: top; }
.kw-table .kw-diff { background: #fdf1e7; }
.kw-case-title { display: block; font-weight: 400; color: #4a5a6a; font-size: 0.78rem; }
.kw-table-wrap { overflow-x: auto; }
.kw-clock label { margin-right: 0.5rem; }

</style>
</head>
<body>
<div id="root"></div>
