name: Core checks
on:
  push:
    branches: [main, feat/local-check-in]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kawsay-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kawsay-core/package-lock.json
      - run: npm ci
      - run: npm run test:checkin-smoke
      - run: npm test
      - run: npm run typecheck
      - run: npm run check-data -- --dir fixtures --strict
      - run: npm run demo
      - run: npm run test:simulador
      - run: npm run test:simulador-ui
      - run: python -m unittest discover -s ../data-gen -v
      - uses: actions/upload-artifact@v4
        with:
          name: kawsay-local-preview
          path: |
            kawsay-core/demo/kawsay-screens-preview.html
            kawsay-core/demo/kawsay-simulador.html
